<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YYB Go - 登录</title>
  <style>
    :root {
      --bg: oklch(0.974 0.004 250);
      --surface: oklch(1 0 0);
      --ink: oklch(0.19 0.025 252);
      --muted: oklch(0.43 0.025 252);
      --line: oklch(0.885 0.012 250);
      --primary: oklch(0.54 0.205 3);
      --primary-hover: oklch(0.48 0.195 3);
      --danger: oklch(0.55 0.18 25);
      --danger-soft: oklch(0.955 0.032 25);
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }
    .login-card {
      width: min(380px, calc(100vw - 32px));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .mark {
      width: 44px; height: 44px;
      border-radius: var(--radius);
      display: grid; place-items: center;
      background: var(--ink); color: var(--surface);
      font-weight: 800; font-size: 20px;
      margin: 0 auto 16px;
    }
    h1 {
      text-align: center;
      font-size: 20px; font-weight: 760;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .field {
      display: grid; gap: 6px;
      margin-bottom: 18px;
    }
    .field label {
      color: var(--muted);
      font-size: 12px; font-weight: 680;
    }
    .input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      padding: 10px 11px;
      font: inherit;
      outline: none;
      transition: border-color 160ms ease;
    }
    .input:focus {
      border-color: oklch(0.44 0.112 190);
    }
    .btn {
      width: 100%;
      min-height: 40px;
      border: none;
      border-radius: var(--radius);
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.62; cursor: not-allowed; }
    .btn:focus-visible {
      outline: 3px solid oklch(0.82 0.08 190);
      outline-offset: 2px;
    }
    .error {
      min-height: 20px;
      text-align: center;
      color: var(--danger);
      font-size: 13px;
      margin-top: 12px;
      visibility: hidden;
    }
    .error.show { visibility: visible; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="mark" aria-hidden="true">Y</div>
    <h1>YYB Go 控制台</h1>
    <p class="sub">请输入登录密码</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="passwordInput">密码</label>
        <input class="input" type="password" id="passwordInput" placeholder="请输入密码" autofocus>
      </div>
      <button class="btn" type="submit" id="submitBtn">登 录</button>
    </form>
    <div class="error" id="errorMsg"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    function showError(msg) {
      const el = $("errorMsg");
      el.textContent = msg;
      el.classList.add("show");
    }

    function hideError() {
      const el = $("errorMsg");
      el.classList.remove("show");
    }

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();
      const password = $("passwordInput").value;
      if (!password) {
        showError("请输入密码");
        return;
      }
      const btn = $("submitBtn");
      btn.disabled = true;
      btn.textContent = "登录中…";
      try {
        const resp = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password })
        });
        const text = await resp.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = text; }
        const isEnvelope = data && typeof data === "object" && !Array.isArray(data)
          && Object.prototype.hasOwnProperty.call(data, "code")
          && Object.prototype.hasOwnProperty.call(data, "msg");
        if (!resp.ok || (isEnvelope && data.code !== 0)) {
          showError(isEnvelope ? data.msg : ("HTTP " + resp.status));
          btn.disabled = false;
          btn.textContent = "登 录";
          return;
        }
        // 登录成功后跳转
        const redirect = (isEnvelope && data.data && data.data.redirect) ? data.data.redirect : "/";
        location.href = redirect;
      } catch (err) {
        showError("网络错误，请重试");
        btn.disabled = false;
        btn.textContent = "登 录";
      }
    });
  </script>
</body>
</html>
