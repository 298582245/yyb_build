<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f2ed"><title>仪表盘 · YYB Go</title><link rel="stylesheet" href="/static/css/console.css"></head>
<body data-page="dashboard"><div class="app-shell"><aside class="sidebar" aria-label="主导航"><div class="brand"><div class="brand-mark">Y</div><div><p class="brand-title">YYB Go</p><div class="brand-subtitle">小程序能力控制台</div></div></div><div class="nav-label">Workspace</div><nav class="nav-list" id="desktopNav"></nav><div class="sidebar-foot"><div class="service-state" id="sidebarHealth"><span class="state-dot"></span><span>服务检测中</span></div><div class="sidebar-version">YYB Go · control plane</div></div></aside><main class="main"><header class="mobile-topbar"><div class="mobile-brand"><div class="brand-mark">Y</div><strong>YYB Go</strong></div><div class="mobile-status" id="mobileHealth"><span class="state-dot"></span><span>在线</span></div></header><header class="desktop-topbar"><a class="top-link" href="/docs/index.html" target="_blank" rel="noreferrer"><span data-icon="book"></span>接口文档</a><a class="button primary" href="/scan"><span data-icon="qr"></span>扫码添加账号</a></header><div class="content"><section class="view"><div class="view-head"><div><p class="eyebrow">Overview</p><h1>仪表盘</h1><p>今天的运行状态，从这里开始。</p></div><div class="head-actions"><button class="button secondary" id="refreshDashboardBtn"><span data-icon="refresh"></span>刷新数据</button></div></div><div class="metric-grid"><article class="metric"><div class="metric-label"><span data-icon="pulse"></span>当前在线</div><div class="metric-value" id="onlineMetric">0</div><div class="metric-note">状态为可用的账号</div></article><article class="metric"><div class="metric-label"><span data-icon="users"></span>总账号数</div><div class="metric-value" id="totalMetric">0</div><div class="metric-note">已接入的微信账号</div></article><article class="metric"><div class="metric-label"><span data-icon="trend"></span>今日请求</div><div class="metric-value" id="todayMetric">0</div><div class="metric-note">请求日志模块待接入</div></article><article class="metric"><div class="metric-label"><span data-icon="layers"></span>总请求</div><div class="metric-value" id="totalRequestsMetric">0</div><div class="metric-note">请求日志模块待接入</div></article></div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>账号状态</h2><p>最近接入的账号</p></div><a class="button ghost" href="/account-management">查看全部 <span data-icon="arrow"></span></a></div><div class="panel-body" id="dashboardAccounts"></div></section><section class="panel"><div class="panel-head"><div><h2>常用操作</h2><p>快速进入工作区</p></div></div><div class="panel-body quick-grid"><a class="quick-action" href="/account-management"><span class="quick-icon" data-icon="users"></span><span><strong>管理账号</strong><span>查看、刷新或移除账号</span></span></a><a class="quick-action" href="/debug"><span class="quick-icon" data-icon="terminal"></span><span><strong>调用调试</strong><span>验证小程序能力接口</span></span></a><a class="quick-action" href="/system-settings"><span class="quick-icon" data-icon="sliders"></span><span><strong>系统配置</strong><span>密码与 API Token</span></span></a></div></section></div></section></div></main></div><nav class="mobile-nav" id="mobileNav" aria-label="移动端主导航"></nav><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="/static/js/console.js"></script></body></html>
