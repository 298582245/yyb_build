<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号管理 · YYB Go</title>
  <link rel="stylesheet" href="/static/css/console.css">
</head>
<body data-page="accounts">
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><div class="brand-mark">Y</div><div><p class="brand-title">YYB Go</p><div class="brand-subtitle">小程序能力控制台</div></div></div>
      <div class="nav-label">Workspace</div><nav class="nav-list" id="desktopNav"></nav>
      <div class="sidebar-foot"><div class="service-state" id="sidebarHealth"><span class="state-dot"></span><span>服务检测中</span></div><div class="sidebar-version">YYB Go · control plane</div></div>
    </aside>
    <main class="main">
      <header class="mobile-topbar"><div class="mobile-brand"><div class="brand-mark">Y</div><strong>YYB Go</strong></div><div class="mobile-status" id="mobileHealth"><span class="state-dot"></span><span>在线</span></div></header>
      <header class="desktop-topbar"><a class="top-link" href="/docs/index.html" target="_blank" rel="noreferrer"><span data-icon="book"></span>接口文档</a><button class="button primary" type="button" data-open-account-qr><span data-icon="qr"></span>扫码添加账号</button></header>
      <div class="content">
        <section class="view">
          <div class="view-head"><div><p class="eyebrow">Accounts</p><h1>账号管理</h1><p>集中查看登录状态，保持账号池可用。</p></div><div class="head-actions"><button class="button secondary" id="refreshAllBtn"><span data-icon="refresh"></span>刷新存活</button><button class="button secondary" id="resyncAllBtn"><span data-icon="sync"></span>同步资料</button><button class="button primary" type="button" data-open-account-qr><span data-icon="plus"></span>添加账号</button></div></div>
          <section class="panel"><div class="panel-head"><div><h2>账号列表</h2><p id="accountListMeta">加载中</p></div><button class="button ghost" id="reloadAccountsBtn"><span data-icon="refresh"></span>重新加载</button></div>
            <div class="table-wrap"><table class="account-table"><thead><tr><th>账号</th><th>状态</th><th>UID</th><th>总请求</th><th>最近检查</th><th><span class="sr-only">操作</span></th></tr></thead><tbody id="accountTableBody"></tbody></table></div>
            <div class="account-cards" id="accountCards"></div>
          </section>
        </section>
      </div>
    </main>
  </div>
  <nav class="mobile-nav" id="mobileNav" aria-label="移动端主导航"></nav>
  <dialog class="modal-dialog account-qr-dialog" id="accountQrDialog" aria-labelledby="accountQrTitle">
    <div class="modal-head"><div><h2 id="accountQrTitle">扫码添加账号</h2><p>使用手机微信扫描并确认登录</p></div><button class="icon-button" type="button" id="closeAccountQrBtn" aria-label="关闭">×</button></div>
    <div class="modal-body"><div class="qr-wrap" id="accountQrWrap"><span>正在获取二维码…</span></div><div class="qr-status" id="accountQrStatus" role="status">准备中</div><div class="qr-countdown" id="accountQrCountdown"></div><div class="qr-account" id="accountQrResult"></div></div>
    <div class="modal-actions"><button class="button secondary" type="button" id="refreshAccountQrBtn"><span data-icon="refresh"></span>重新生成</button><button class="button primary" type="button" id="cancelAccountQrBtn">关闭</button></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/console.js"></script>
</body>
</html>
